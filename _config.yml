theme: jekyll-theme-chirpy
lang: en
timezone: Africa/Cairo

title: "0xNegan"
tagline: "Red Team Operator · Cloud Security · Web3 Auditor"
description: >-
  Offensive security research — identity-layer attacks, cloud red teaming,
  Web3 security auditing, and AI adversarial research. 100+ vulnerabilities.
  5+ Hall of Fame recognitions. The bat doesn't ask twice.

url: "https://0xnegan.github.io"

github:
  username: 0xnegan

social:
  name: 0xNegan
  links:
    - https://www.linkedin.com/in/ahmed-13b6bb279
    - https://github.com/0xnegan
    - https://youtube.com/@negansec

theme_mode: dark
avatar: "/assets/img/site/avatar.png"
toc: true

comments:
  provider:

pwa:
  enabled: true

paginate: 10

future: true

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _tabs
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
