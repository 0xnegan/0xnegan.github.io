# ============================================================
# 0xNegan — Site Configuration
# ============================================================

theme: jekyll-theme-chirpy

lang: en
timezone: Africa/Cairo

# --- Branding ---
title: "0xNegan"
tagline: "Red Team Operator · Cloud Security Researcher · AI Red Teamer"
description: >-
  Offensive security research, cloud identity attacks, adversary simulation,
  and AI red teaming. CRTO | COPO certified. Building attack chains that
  mirror real-world adversaries.

url: "https://0xnegan.github.io"

github:
  username: 0xnegan

social:
  name: Ahmed Hisham Hassan (0xNegan)
  email: # your-email@example.com
  links:
    - https://www.linkedin.com/in/ahmed-13b6bb279
    - https://github.com/0xnegan
    - https://youtube.com/@negansec

# --- Display ---
theme_mode: dark  # Force dark mode as default

avatar: "/assets/img/avatar.png"

toc: true

# --- Comments (configure later) ---
comments:
  provider:

# --- PWA ---
pwa:
  enabled: true

paginate: 10

# --- Build ---
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _tabs
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
