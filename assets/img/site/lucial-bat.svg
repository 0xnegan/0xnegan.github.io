    <line x1="235" y1="650" x2="242" y2="643"/><line x1="235" y1="650" x2="242" y2="657"/>
    <line x1="165" y1="700" x2="158" y2="693"/><line x1="165" y1="700" x2="158" y2="707"/>
    <line x1="235" y1="720" x2="242" y2="713"/><line x1="235" y1="720" x2="242" y2="727"/>
    <line x1="165" y1="760" x2="158" y2="753"/><line x1="165" y1="760" x2="158" y2="767"/>
